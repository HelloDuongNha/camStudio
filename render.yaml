services:
  - type: web
    name: cam-studio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: APP_ORIGIN
        value: https://campoc.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: camstudio
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ROOM_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
